const P=L.concat(A,A2,K,S,W,T,R2,A3,F,F2).map((q,k)=>[q[0],q[1],q[2],"p"+k.toString(36),(k>=30&&k<66)||k>=130?1:0]);
const TH=[{n:"恋愛編",d:"恋愛観・本音を深掘り",r:[[0,30],[114,130]]},{n:"大人編",d:"大人の関係・夜の価値観を深掘り",ad:1,r:[[30,66],[130,142]]},{n:"セフレ編",d:"割り切った関係のリアルな本音",ad:1,r:[[142,202]]}];
const app=document.getElementById("app"),BASE=location.href.split("#")[0];
let mode,ans=[],i=0,target=[],QS=[],sel=new Set(L.map((_,k)=>k)),cus=[],op=new Set([0]);
const $=h=>{app.innerHTML=h;scrollTo(0,0)};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const enc=s=>{let r="";for(let k=0;k<s.length;k++)r+=s.charCodeAt(k).toString(36).padStart(4,"0");return r};
const dec=s=>(s.match(/.{4}/g)||[]).map(x=>String.fromCharCode(parseInt(x,36))).join("");
const clr=()=>{try{history.replaceState(null,"",location.pathname+location.search)}catch(e){}};
function parse(h){h=(h||"").replace(/^#/,"");let m,qs,t;
 if(m=/^r([01]{30})$/.exec(h)){qs=P.slice(0,30);t=m[1]}
 else if(m=/^s([01]{3,40})-([0-9a-z-]+)$/.exec(h)){t=m[1];qs=[];
  for(const k of m[2].split("-")){
   if(k[0]==="p"){const q=P[parseInt(k.slice(1),36)];if(!q)return null;qs.push(q)}
   else if(k[0]==="c"&&k.length>4&&(k.length-1)%4===0){const s=dec(k.slice(1)).split("|");if(s.length!==3||!s[0]||!s[1]||!s[2])return null;qs.push([s[0],s[1],s[2],k,0])}
   else return null}
  if(qs.length!==t.length)return null}
 else return null;
 return{qs,t:[...t].map(Number)}}
function load(h){const r=parse(h);if(!r)return false;QS=r.qs;target=r.t;return true}
function hearts(){const d=document.createElement("div");d.id="hearts";d.setAttribute("aria-hidden","true");const cs=["#ff4d94","#ff7ab8","#d17bff","#c026d3"];for(let k=0;k<18;k++){const e=document.createElement("span");e.textContent="♥";e.style.cssText=`left:${Math.random()*96}%;font-size:${12+Math.random()*26}px;color:${cs[k%4]};animation-duration:${14+Math.random()*16}s;animation-delay:-${Math.random()*28}s`;d.appendChild(e)}document.body.prepend(d)}
let th=0;
function home(){
 if(load(location.hash))return guessIntro();
 $(`<span class="tag">2択・恋愛ディープ</span><h1>ドキドキ<span class="hh">❤︎</span>どっちどっち？</h1>
 <p class="sub">編を選ぶとすぐ質問がスタート。本音で答えてリンクを友達に送ると、友達があなたの答えを当てにきます。</p>
 ${TH.map((t,k)=>`<button class="card th" data-t="${k}"><b>${t.n}</b>${t.ad?'<span class="adt">18+</span>':""}<span class="sub">${t.d}</span></button>`).join("")}
 <div class="card"><b>友達のリンクやコードで挑戦</b><input type="text" id="cd" placeholder="リンクまたはコードを貼り付け"><button class="ghost" id="go">挑戦する</button><p class="sub" id="er"></p></div>`);
 app.querySelectorAll(".th").forEach(b=>b.onclick=()=>start(+b.dataset.t));
 go.onclick=()=>{if(!load(cd.value.trim().replace(/^.*#/,""))){er.textContent="リンクまたはコードが正しくありません";return}guessIntro()};
}
const poolOf=t=>TH[t].r.flatMap(([a,b])=>Array.from({length:b-a},(_,j)=>a+j));
function start(t){
 th=t;mode="make";ans=[];i=0;
 QS=poolOf(t).sort(()=>Math.random()-.5).slice(0,30).map(k=>P[k]);

}
function swap(){
 const used=new Set(QS.map(q=>q[3])),c=poolOf(th).filter(k=>!used.has(P[k][3])).sort(()=>Math.random()-.5).slice(0,3);

 ${c.map(k=>`<button class="opt" data-k="${k}">${esc(P[k][0])}<br><span class="sub">${esc(P[k][1])} / ${esc(P[k][2])}</span></button>`).join("")}
 <button class="ghost" id="rr">他の候補を見る</button>
 <details class="card"><summary>自分で質問を書く</summary><input type="text" id="qt" maxlength="40" placeholder="質問"><input type="text" id="qa" maxlength="20" placeholder="選択肢A"><input type="text" id="qb" maxlength="20" placeholder="選択肢B"><button class="ghost" id="ad">この質問にする</button></details>
 <button class="ghost" id="cn">もとの質問に戻る</button>`);
 app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{QS[i]=P[+b.dataset.k];ask()});
 rr.onclick=swap;cn.onclick=ask;

}
function guessIntro(){
 const ad=QS.some(q=>q[4]);
 $(`<span class="tag">全${QS.length}問・2択</span><h1>友達の恋愛、いくつ当てられる？</h1>
 <p class="sub">恋愛の本音クイズ。相手が選んだのはどっち？ 直感で答えよう。</p>

 bk.onclick=()=>{clr();target=[];QS=[];home()};
}
function ask(){
 const q=QS[i],N=QS.length;
 $(`<div class="bar"><i style="width:${i/N*100}%"></i></div>
 <p class="sub">${i+1} / ${N}　${mode==="make"?"あなたはどっち？":"相手が選んだのはどっち？"}</p>
 <div class="q">${esc(q[0])}</div>
 <button class="opt" data-v="0">${esc(q[1])}</button><button class="opt" data-v="1">${esc(q[2])}</button>${mode==="make"?'<button class="ghost" id="sw">この質問は違う → 別の質問を選ぶ</button>':""}`);
 app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pick(+b.dataset.v,b));

}
function pick(v,b){
 ans.push(v);
 if(mode==="guess"){
  const ok=v===target[i];
  app.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(+x.dataset.v===target[i])x.classList.add("ok");else if(x===b)x.classList.add("ng")});
  setTimeout(next,ok?500:900);
 }else next();
}
function next(){i++;i<QS.length?ask():(mode==="make"?made():result())}
function made(){
 const code="s"+ans.join("")+"-"+QS.map(q=>q[3]).join("-"),link=BASE+"#"+code;
 try{location.hash=code}catch(e){}
 $(`<span class="tag">完成</span><h1>あなたの出題リンク</h1>
 <p class="sub">このリンクを友達に送ってください。開くだけで挑戦でき、友達も自分の問題を作って別の人へ回せます。</p>

function result(){
 const N=QS.length,s=ans.filter((v,k)=>v===target[k]).length,r=s/N;

 $(`<span class="tag">結果</span><p class="score">${s}<span style="font-size:22px"> / ${N}</span></p>

 mk2.onclick=()=>{clr();target=[];home()};
}

hearts();
